name: k0
pt_bins: [0.3, 0.4, 0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.1, 1.2, 1.3, 1.4, 1.5, 1.75, 2.0, 2.25, 2.5, 3.0, 4.0, 5.0, 6.0]
eta_cut: 0.3 # Maximum eta
alpha_cut: 0.05   # Max absolute value of alpha
qt_cut: 0.1       # Minimum qt
mass_min: 0.46
mass_max: 0.53
seed: 42

generation:
  do: false
  nEvents: 300000000
  nthreads: 30
  output: signal/decays.root

signal:
  data:
    do: false
    input: Datasets/AO2D_dataArm_686526_2024.root
    output: signal/2024/data.root
  mc:
    do: false
    input: Datasets/AO2D_mcArm_679678_2024.root
    output: signal/2024/mc.root

fit:
  do: true
  inputs:
    data: signal/2024/data.root
    mc: signal/2024/mc.root
  decays: signal/decays.root
  max_per_bin: 1000000 # Maximum number of decays to use per pT bin (for fitting)
  grid_search: false # Whether to perform a grid search for the fit parameters instead of using a minimizer
  output: outputs/2024/fit_results.root  
